<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 280" font-family="serif" font-size="16">
  <rect width="750" height="280" fill="white"/>
  <style>
    .box { fill: white; stroke: black; stroke-width: 1.5; }
    .channel { fill: #f0f0f0; stroke: black; stroke-width: 1.5; }
    .arrow { stroke: black; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    text { fill: black; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>

  <!-- X input (bit) -->
  <text x="25" y="142" font-style="italic" text-anchor="end">X</text>
  <line x1="32" y1="140" x2="80" y2="140" class="arrow"/>

  <!-- S input -->
  <text x="135" y="48" text-anchor="middle" font-style="italic">S</text>
  <line x1="135" y1="58" x2="135" y2="105" class="arrow"/>

  <!-- Encoder box -->
  <rect x="85" y="110" width="100" height="55" class="box"/>
  <text x="135" y="133" text-anchor="middle">Encode</text>
  <text x="135" y="153" text-anchor="middle" font-style="italic" font-size="14">encode<tspan baseline-shift="sub" font-size="10">A</tspan></text>

  <!-- Arrow out of encoder -->
  <line x1="185" y1="137" x2="240" y2="137" stroke="black" stroke-width="1.5" fill="none"/>
  <circle cx="240" cy="137" r="3" fill="black"/>

  <!-- Upper branch: legitimate channel -->
  <line x1="240" y1="137" x2="240" y2="72" stroke="black" stroke-width="1.5" fill="none"/>
  <line x1="240" y1="72" x2="290" y2="72" class="arrow"/>

  <!-- Legitimate channel box -->
  <rect x="295" y="45" width="200" height="50" class="channel"/>
  <text x="395" y="66" text-anchor="middle" font-size="13">Legitimate channel</text>
  <text x="395" y="85" text-anchor="middle" font-style="italic" font-size="13">G<tspan baseline-shift="sub" font-size="10">A</tspan> = decode<tspan baseline-shift="sub" font-size="10">A</tspan>(encode<tspan baseline-shift="sub" font-size="10">A</tspan>(S, X))</text>

  <!-- Arrow: legitimate → Y = G_A -->
  <line x1="495" y1="70" x2="560" y2="70" class="arrow"/>
  <text x="590" y="75" font-style="italic">Y = G<tspan baseline-shift="sub" font-size="11">A</tspan></text>

  <!-- Lower branch: eavesdropper channel -->
  <line x1="240" y1="137" x2="240" y2="210" stroke="black" stroke-width="1.5" fill="none"/>
  <line x1="240" y1="210" x2="290" y2="210" class="arrow"/>

  <!-- Eavesdropper channel box -->
  <rect x="295" y="185" width="200" height="50" class="channel"/>
  <text x="395" y="206" text-anchor="middle" font-size="13">Eavesdropper channel</text>
  <text x="395" y="225" text-anchor="middle" font-style="italic" font-size="13">G<tspan baseline-shift="sub" font-size="10">E</tspan> = decode<tspan baseline-shift="sub" font-size="10">E</tspan>(encode<tspan baseline-shift="sub" font-size="10">A</tspan>(S, X))</text>

  <!-- Arrow: eavesdropper → Z = G_E -->
  <line x1="495" y1="210" x2="560" y2="210" class="arrow"/>
  <text x="590" y="215" font-style="italic">Z = G<tspan baseline-shift="sub" font-size="11">E</tspan></text>

  <!-- Caption -->
  <text x="350" y="268" text-anchor="middle" font-size="12">
    decode<tspan baseline-shift="sub" font-size="9" font-style="italic">A</tspan> = same-model decoder,  decode<tspan baseline-shift="sub" font-size="9" font-style="italic">E</tspan> = eavesdropper decoder
  </text>
</svg>
